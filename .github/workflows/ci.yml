name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  core-tests:
    name: core unit tests (no ROS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libeigen3-dev libgtest-dev

      - name: prism_loc_core — build & test
        run: |
          cmake -S prism_loc_core -B build/core -DPRISM_LOC_CORE_BUILD_TESTS=ON
          cmake --build build/core -j
          ( cd build/core && ctest --output-on-failure )

      - name: prism_loc_fusion — build & test
        run: |
          cmake -S prism_loc_fusion -B build/fusion -DPRISM_LOC_FUSION_BUILD_TESTS=ON
          cmake --build build/fusion -j
          ( cd build/fusion && ctest --output-on-failure )

  ros-build:
    name: ROS 2 Humble build & test
    runs-on: ubuntu-latest
    container:
      image: ros:humble
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/prism_loc

      - name: apt-get update
        run: apt-get update

      - name: rosdep update & install
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --event-handlers console_direct+

      - name: colcon test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --packages-select prism_loc_core prism_loc prism_loc_fusion prism_loc_fusion_ros

      - name: colcon test-result
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon test-result --verbose

      - name: script deps
        run: apt-get install -y --no-install-recommends python3-numpy python3-yaml

      # Each shipped launch file starts headless on generated maps; every key of its
      # params YAML must be declared and applied by the running node (ROS 2 ignores
      # undeclared keys silently), and the node must publish its /diagnostics status.
      - name: launch files + parameter binding
        shell: bash
        env:
          ROS_DOMAIN_ID: "92"
        run: |
          source install/setup.bash
          mkdir -p ci_logs && cd ci_logs
          bash ../src/prism_loc/scripts/launch_checks.sh laser2d ndt3d fusion3d

      # fusion3d /diagnostics around the map->base_link fallback: OK without odometry,
      # WARN when odometry appears next to the fallback (two parents) or stops.
      - name: fusion3d fallback diagnostics
        shell: bash
        env:
          ROS_DOMAIN_ID: "92"
        run: |
          source install/setup.bash
          mkdir -p ci_logs && cd ci_logs
          python3 ../src/prism_loc/scripts/make_fixtures.py fusion_fix
          timeout 120 python3 ../src/prism_loc/scripts/fusion_fallback_check.py \
            ../install/prism_loc_fusion_ros/share/prism_loc_fusion_ros/params/fusion3d.yaml \
            fusion_fix/map.pcd || { tail -n 40 fusion_fallback.log; exit 1; }

      # fusion3d with the lidar, the IMU and the GNSS antenna mounted off base_link (static
      # TF): the pose is that of base_link within 0.05 m and 0.02 rad; an input whose mount
      # is missing is left out and /diagnostics says so; *_frame overrides the frame name;
      # GNSS and IMU alone with sensor noise stay consistent for 30 s, and with a constant
      # gyro bias for 45 s, across a reseed, on a slope, over a start and a stop, with a gap in
      # the fixes, from a start before the antenna mount is known, and from a boot with initial_yaw 2 rad
      # off (the whole script takes about 18 minutes on a desktop; 2700 s here). The 600 s standing scenario
      # (gnss_stand_long, 10 more minutes) and the outage across a start (gnss_gap_across_start, 8 minutes)
      # are not part of it: run them with --long or --scenario. The core test HeadingSigmaStaysAtTheBoundForFifteenMinutes
      # covers the same mechanism in CI.
      # The workspace above is built without optimization; one NDT registration then takes
      # over a second on the thread that also takes the IMU and /diagnostics reports
      # "IMU stopped". The two fusion packages are rebuilt optimized for this step so that
      # the check can demand an OK status. --tolerate-imu-gaps: on this two-core runner
      # the script's own 100 Hz loop can stall for a few samples (a WARN about IMU gaps
      # only; "IMU stopped" and every other status still fail).
      - name: fusion3d sensor mounts
        shell: bash
        env:
          ROS_DOMAIN_ID: "92"
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --packages-select prism_loc_fusion prism_loc_fusion_ros \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
          source install/setup.bash
          mkdir -p ci_logs && cd ci_logs
          timeout 2700 python3 ../src/prism_loc/scripts/fusion_extrinsic_check.py \
            ../install/prism_loc_fusion_ros/share/prism_loc_fusion_ros/params/fusion3d.yaml \
            --tolerate-imu-gaps \
            || { for f in fusion_extrinsic_*.log; do echo "--- $f"; tail -n 40 "$f"; done; exit 1; }

      # laser2d over real topics/TF on a synthetic world: convergence, map->odom stamp
      # and cadence, recovery after a scan gap, poses at a 0.1x sim clock, no low-n_eff
      # warning after /initialpose, and the /diagnostics status for stopped scans,
      # missing odometry, zero-stamped scans and a stuck ROS clock.
      - name: synthetic end-to-end (laser2d)
        shell: bash
        env:
          ROS_DOMAIN_ID: "92"
        run: |
          source install/setup.bash
          mkdir -p ci_logs && cd ci_logs
          timeout 900 python3 ../src/prism_loc/scripts/synthetic_e2e.py \
            ../install/prism_loc/share/prism_loc/params/laser2d.yaml \
            || { for f in e2e_*.log; do echo "--- $f"; tail -n 40 "$f"; done; exit 1; }

      # ndt3d on the same world in 3D (16-ring lidar, prior map as PCD): tracking error,
      # the "pose not verified" WARN after /initialpose and an OK status from then on in
      # healthy tracking, the "low scan-to-map match" WARN after a kidnap, for a pose off
      # the map and for a wrong base_height; that min_match_fraction and
      # match_verify_updates drive the status; the startup WARN (tilt) and INFO (height)
      # about the parts of the sensor transform that ndt3d ignores.
      # The workspace above is built without optimization. ndt3d scores up to 500 points
      # for each of 500 to 2000 particles per update; at -O0 one update takes over a
      # second and the node cannot follow a 10 Hz lidar, so its packages are rebuilt
      # optimized for this step (the steps above ran on the unoptimized build).
      - name: synthetic end-to-end (ndt3d)
        shell: bash
        env:
          ROS_DOMAIN_ID: "92"
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --packages-select prism_loc_core prism_loc \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
          source install/setup.bash
          mkdir -p ci_logs && cd ci_logs
          timeout 600 python3 ../src/prism_loc/scripts/synthetic_e2e.py \
            ../install/prism_loc/share/prism_loc/params/ndt3d.yaml \
            || { for f in e2e_ndt3d_*.log; do echo "--- $f"; tail -n 40 "$f"; done; exit 1; }
