/**:
  ros__parameters:
    backend: "ndt3d"                  # str: localization backend selector ("laser2d" | "ndt3d")
    global_frame: "map"               # str: fixed map frame that map->odom is broadcast in
    odom_frame: "odom"                # str: odometry frame (child of map in the TF tree)
    base_frame: "base_link"           # str: robot body frame the pose estimate refers to
    points_topic: "/points"           # str: PointCloud2 input topic (subscribed BEST_EFFORT)
    map_pcd_path: ""                  # str: absolute path to the .pcd map (REQUIRED; empty aborts startup)
    ndt_resolution: 1.0               # m: NDT voxel (cell) edge length for the map
    voxel_min_points: 5               # count: min points per voxel to form a valid NDT cell
    max_points: 500                   # count: scan points subsampled per measurement update (must be >= ndt_effective_points unless that is 0, the default)
    base_height: 0.0                  # m: height of the LIDAR for the model. ground_height_from_map off: its z in the map frame (its height above a map ground plane at z = 0), not the robot's height. On: its height above the local ground. The TF's z is not used; its roll and pitch only with use_sensor_tilt
    ground_height_from_map: false     # bool: false = the cloud sits at the constant map z base_height (previous behaviour). true = at ground(x, y) + base_height, with the ground height of each particle from a grid built from the map points (needs map points on the ground under the route)
    ground_resolution: 1.0            # m: xy cell edge of the ground grid (> 0); heights are interpolated between cell centres
    ground_layer_gap: 0.2             # m: smallest empty vertical gap that separates two surfaces in one cell (floor / ceiling underside, two floors; > 0)
    ground_max_step: 0.5              # m: a surface counts for a particle only within this of the ground height under the estimate (> 0)
    ground_min_points: 5              # count: map points a cell (and a surface inside it) needs for a ground height (>= 1)
    use_sensor_tilt: false            # bool: false = ignore the roll and pitch of base_frame -> cloud frame (WARN at startup). true = level each cloud with them (a static mount correction; the body's roll and pitch on a slope are not handled)
    ndt_effective_points: 0.0         # count: the scan counts as this many independent points in the likelihood (mean per-point log score x this value; 0 = off, plain sum over max_points, the previous behaviour; opt-in, try 5-10; at most max_points)
    ndt_min_sigma: 0.0                # m: absolute floor on the std deviation of every NDT cell along each axis (0 = off, relative floor only, the previous behaviour; opt-in, use together with ndt_effective_points, try 0.05-0.10 and re-measure min_match_fraction; the scoring of a pose for match_fraction ignores it, but the estimated pose can change; at most ndt_resolution)
    min_particles: 500                # count: lower bound on the particle set size
    max_particles: 2000               # count: upper bound on the particle set size
    resample_threshold: 0.5           # fraction: resample when Neff < threshold * N (weights carry over while resampling is skipped; 0 = never resample, weights accumulate forever)
    kld_err: 0.05                     # fraction: KLD max error bound between true/estimated distribution
    kld_z: 2.33                       # unitless: upper standard-normal quantile for KLD (~0.99)
    kld_bin_xy: 0.5                   # m: KLD histogram bin size in x and y
    kld_bin_yaw: 0.17                 # rad: KLD histogram bin size in yaw (~10 deg)
    update_min_d: 0.2                 # m: min translation before a filter update runs
    update_min_a: 0.2                 # rad: min rotation before a filter update runs
    transform_tolerance: 0.1          # s: future-dating added to the map->odom TF stamp
    tf_broadcast: true                # bool: broadcast map->odom (false when another node owns it)
    seed: 42                          # count: RNG seed for the particle filter
    alpha1: 0.2                       # unitless: odometry noise, rotation from rotation
    alpha2: 0.2                       # unitless: odometry noise, rotation from translation
    alpha3: 0.2                       # unitless: odometry noise, translation from translation
    alpha4: 0.2                       # unitless: odometry noise, translation from rotation
    set_initial_pose: false           # bool: seed a Gaussian at initial_pose_* on startup
    startup_timeout_s: 30.0           # s: /diagnostics grace before a missing map/input/pose seed is an ERROR
    input_timeout_s: 1.0              # s: /diagnostics ERROR when input stops for max(this, periods x input period)
    input_timeout_periods: 5.0        # count: input periods of silence before /diagnostics reports input stopped
    min_neff_fraction: 0.0            # fraction: /diagnostics WARN when Neff/N at an update falls below this (0 = off; off for ndt3d, where Neff does not tell good tracking from bad)
    min_match_fraction: 0.65          # fraction: /diagnostics WARN when the share of scan points on mapped surfaces (mean of the last 5 updates) falls below this (0 = off). Set it just under the lowest match_fraction of a known-good run on your site
    match_verify_updates: 15          # count: after /initialpose, /diagnostics WARNs "pose not verified" until this many filter updates have been judged (0 = off)
